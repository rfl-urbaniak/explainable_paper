[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pci-paper"
version = "0.1"
description = "Computational notebooks for the PCI paper."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Rafal Urbaniak" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "torch",
    "torchvision",
    "pyro-ppl",
    "chirho[dynamical] @ git+https://github.com/BasisResearch/chirho.git",
    "matplotlib",
    "seaborn",
    "tqdm",
    "graphviz",
    "shap>=0.51.0",
    "loguru",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "nbqa>=1.9.1",
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff>=0.15.12",
]
docs = [
    "sphinx",
    "nbsphinx",
    "sphinx-rtd-theme",
    "myst-parser",
    "sphinxcontrib-jquery",
    "sphinx-autodoc-typehints",
    "jupyter",
    "ipykernel",
    "nbconvert",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pci*"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["build"]

[tool.ruff.format]
quote-style = "double"

[tool.flake8]
max-line-length = 120

[tool.coverage.run]
source = ["pci", "tests"]

[tool.coverage.report]
show_missing = true
precision = 1
skip_covered = false

[tool.coverage.html]
directory = "tests/coverage"

[tool.ruff.lint]
extend-ignore = ["E203"]
# `make format` will not strip unused imports; `make remove-imports` does that
# explicitly (notebooks often import purely for display side effects).
unfixable = ["F401"]
select = [
  "F",       # pyflakes
  "I",       # isort
  "PERF",    # performance
  "UP"       # pyupgrade
]
